; logger.conf do DeskVoice. Arquivo estático: o kit copia para asterisk/generated e o Compose monta.
; Faz o mesmo que o logger.conf da imagem fixada (andrius/asterisk 20.20.1), cujas linhas ativas são
; só as duas de [logfiles], com uma diferença: não grava /var/log/asterisk/messages.log.
;
; Por quê: aquele arquivo não tinha teto, e a imagem não roda rotação nenhuma. Numa instalação, ele
; passou de 20 GB em duas semanas e quase encheu o disco. O console vai para a saída do contêiner, que o Docker limita (logging: max-size e max-file
; no Compose), e é lido por `docker compose -f deploy/docker-compose.yml logs asterisk`. A linha
; "Log do Asterisk" de install/healthcheck.sh avisa quem ainda tem o arquivo antigo, grande.
;
; Nunca entra aqui um canal em arquivo (messages.log, full, security.log...) sem teto: a cerca
; logs-have-a-ceiling reprova.

