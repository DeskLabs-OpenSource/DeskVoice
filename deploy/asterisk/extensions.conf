; deploy/asterisk/extensions.conf
;
; Toda mídia vai por AudioSocket (TCP puro, apps/voice/src/audiosocket.ts), nunca
; por bridge ARI + externalMedia. Lição herdada do módulo de voz do DeskcommCRM:
; uma bridge de mixing não devolve ao tronco o áudio injetado por um canal
; externalMedia, só silêncio.
;
; O canal passa pela Stasis em dois momentos, e só de leve:
;   1. `inbound`: o worker resolve o agente pelo número discado, cria a chamada,
;      define AUDIOSOCKET_UUID e devolve o canal ao dialplan.
;   2. `after-audio`: quando o worker fecha o AudioSocket, o canal volta para a
;      Stasis e o worker decide entre transferir para um humano e desligar.

[from-trunk]
; Troncos de um número só costumam mandar "s" no lugar dos dígitos discados.
exten => _X.,1,NoOp(DeskVoice entrada: ${CALLERID(num)} -> ${EXTEN})
 same => n,Stasis(deskvoice,inbound)
 same => n,Hangup()
exten => _+X.,1,NoOp(DeskVoice entrada: ${CALLERID(num)} -> ${EXTEN})
 same => n,Stasis(deskvoice,inbound)
 same => n,Hangup()
exten => s,1,NoOp(DeskVoice entrada (tronco de um numero): ${CALLERID(num)})
 same => n,Stasis(deskvoice,inbound)
 same => n,Hangup()

[deskvoice-audio]
exten => s,1,NoOp(DeskVoice audio: ${AUDIOSOCKET_UUID})
 same => n,Answer()
 same => n,AudioSocket(${AUDIOSOCKET_UUID},voice:9092)
 same => n,Stasis(deskvoice,after-audio)
 same => n,Hangup()

[deskvoice-transfer]
; DESKVOICE_TRANSFER_TO e DESKVOICE_TRUNK são definidos pelo worker, em Stasis,
; antes de devolver o canal para cá.
exten => s,1,NoOp(DeskVoice transferindo para ${DESKVOICE_TRANSFER_TO})
 same => n,Dial(PJSIP/${DESKVOICE_TRANSFER_TO}@${DESKVOICE_TRUNK},45)
 same => n,Stasis(deskvoice,transfer-ended,${DIALSTATUS})
 same => n,Hangup()
