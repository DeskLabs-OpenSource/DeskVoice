; modules.conf do DeskVoice. Arquivo estático: o kit copia para asterisk/generated e o Compose monta.
; O que vem antes da seção "PJSIP sem uso" é o modules.conf da imagem fixada
; (andrius/asterisk 20.20.1), copiado como está: o resto do Asterisk carrega igual.
; A lista de módulos só vale na partida do Asterisk: mudar este arquivo reinicia o contêiner
; (converge_asterisk), nunca recarrega.
;
; Asterisk configuration file
;
; Module Loader configuration file
;

[modules]
autoload=yes
;
; Any modules that need to be loaded before the Asterisk core has been
; initialized (just after the logger initialization) can be loaded
; using 'preload'.  'preload' forces a module and the modules it
; is known to depend upon to be loaded earlier than they normally get
; loaded.
;
; NOTE: There is no good reason left to use 'preload' anymore.  It was
; historically required to preload realtime driver modules so you could
; map Asterisk core configuration files to Realtime storage.
; This is no longer needed.
;
;preload = your_special_module.so
;
; If you want Asterisk to fail if a module does not load, then use
; the "require" keyword. Asterisk will exit with a status code of 2
; if a required module does not load.
;
;require = chan_pjsip.so
;
; If you want you can combine with preload
; preload-require = your_special_module.so
;
;load = res_musiconhold.so
;
; Load one of: alsa, or console (portaudio).
; By default, load chan_console only (automatically).
;
noload = chan_alsa.so
;noload = chan_console.so
;
; Do not load res_hep and kin unless you are using HEP monitoring
; <http://sipcapture.org> in your network.
;
noload = res_hep.so
noload = res_hep_pjsip.so
noload = res_hep_rtcp.so
;
; Do not load chan_sip by default, it may conflict with res_pjsip.
noload = chan_sip.so
;
; Load one of the voicemail modules as they are mutually exclusive.
; By default, load app_voicemail only (automatically).
;
;noload = app_voicemail.so
noload = app_voicemail_imap.so
noload = app_voicemail_odbc.so
;
; ── PJSIP sem uso no DeskVoice ──
; O pjproject tem um teto fixo de módulos registrados (PJSIP_MAX_MODULE, do build). Com autoload,
; todos os res_pjsip_* da imagem sobem, o teto estoura ("Too many modules registered") e o último
; módulo PJSIP a registrar fica parado. Qual é depende da ordem de leitura do diretório de módulos,
; que muda de máquina para máquina: numa delas era o res_pjsip_nat, e o force_rport e o
; rewrite_contact das linhas não valiam. A linha "Módulos SIP" de install/healthcheck.sh reprova se
; isso voltar, em qualquer ordem.
; Só ocupa vaga no teto o módulo que registra um módulo no pjproject (ast_sip_register_service ou
; pjsip_endpt_register_module). Por isso aqui só entram os sem uso que registram, e entram vários,
; para deixar folga. Os de presença e caixa postal assinada (pidf, xpidf, dialog_info, mwi,
; exten_state, publish, phoneprov_provider) não ocupam vaga, e ficam como estão.
; Nunca entram aqui: res_pjsip, chan_pjsip, res_pjsip_session, res_pjsip_pubsub (chan_pjsip e
; res_pjsip_refer o exigem para carregar), res_pjsip_sdp_rtp, res_pjsip_nat,
; res_pjsip_outbound_registration, os autenticadores digest, os identificadores de
; endpoint_identifier_order, res_pjsip_registrar, res_pjsip_acl, res_pjsip_caller_id,
; res_pjsip_rfc3326, res_pjsip_dtmf_info, res_pjsip_diversion, res_pjsip_header_funcs,
; res_pjsip_logger e res_pjsip_refer. E nunca "require => res_pjsip_nat.so": o Asterisk que não o
; carrega não sobe, e toda ligação cai, inclusive a das linhas que não estão atrás de NAT.
;
; SIP por WebSocket: o DeskVoice fala SIP só por UDP.
noload = res_pjsip_transport_websocket.so
;
; Mensagem de texto por SIP (MESSAGE): a conversa é por voz.
noload = res_pjsip_messaging.so
;
; Histórico de pacotes SIP: o diagnóstico de SIP é o res_pjsip_logger.
noload = res_pjsip_history.so
