name: publish-image

# Em tag `vX.Y.Z`: constrói e publica uma imagem por processo, para amd64, com a etiqueta
# `X.Y.Z` (sem `v`), que é o mesmo número que a instalação grava.
#
# O endereço das imagens e a conversão entre a tag do git e a etiqueta da imagem NÃO estão
# escritos aqui: vêm de deploy/images.env e de install/_common.sh (`image_ref`, `version_of_tag`),
# os mesmos que o instalador e o atualizador usam. O que este workflow publica e o que a VPS pede
# saem do mesmo lugar.
#
# Só amd64 por enquanto. Construir arm64 por emulação no mesmo passo deixava o amd64 refém: se a
# emulação estourasse o teto, nada era publicado e a tag já existia. Em ARM a instalação constrói
# na própria máquina (`--build`). arm64 publicada volta com runner ARM nativo e junção de manifesto.
#
# Não há canal `stable`: a instalação descobre a versão pelas tags do repositório e grava o número.
# Etiqueta móvel sem leitor acaba usada por alguém.
#
# A release do GitHub é publicada aqui, no último job, depois que as três imagens baixam sem
# credencial: "release publicada" significa "instalável".
#
# `workflow_dispatch` existe para o release.yml disparar este workflow na tag que ele acabou de
# criar (tag empurrada pelo GITHUB_TOKEN não aciona `on: push`). Disparado fora de uma tag, recusa.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  probe:
    name: probe
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      dockerfile: ${{ steps.probe.outputs.dockerfile }}
      version: ${{ steps.probe.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Há o que publicar?
        id: probe
        run: |
          source install/_common.sh
          # Versão só sai de commit que está na main. Não há regra de tags no repositório, então
          # qualquer pessoa com escrita consegue empurrar uma tag de qualquer commit: aqui ela não publica.
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::A tag ${GITHUB_REF} aponta para um commit que não está na main. Nada foi publicado."
            exit 1
          fi
          tag="${GITHUB_REF#refs/tags/}"
          version="$(version_of_tag "${tag}")"
          if [ "${tag}" = "${GITHUB_REF}" ] || [ "$(tag_of_version "${version}")" != "${tag}" ] || ! is_version "${version}"; then
            echo "::error::Imagem só se publica a partir de uma tag vX.Y.Z (veio de ${GITHUB_REF})."
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          if [ -f Dockerfile ]; then
            echo "dockerfile=true" >> "${GITHUB_OUTPUT}"
          else
            echo "dockerfile=false" >> "${GITHUB_OUTPUT}"
            echo "Publicação PULADA: esta tag ainda não tem Dockerfile na raiz." | tee -a "${GITHUB_STEP_SUMMARY}"
          fi

  # As três imagens num job só, no mesmo construtor, uma depois da outra. Voz e rotinas saem do
  # mesmo estágio `base` (dependências instaladas, pacotes do núcleo): construídas em jobs
  # separados, cada uma refazia esse estágio e as camadas saíam com resumos diferentes, e a VPS
  # guardava as duas cópias (cerca de 900 MB a mais na 0.3.0). Aqui o estágio sai uma vez e as
  # duas imagens dividem as camadas. O `verify-public` confere isso.
  build:
    name: build
    needs: [probe]
    if: needs.probe.outputs.dockerfile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Nomes das imagens, pela mesma função que o instalador usa
        id: image
        env:
          VERSION: ${{ needs.probe.outputs.version }}
        run: |
          source install/_common.sh
          for process in ${APP_SERVICES}; do
            echo "${process}=$(image_ref "${process}" "${VERSION}")" >> "${GITHUB_OUTPUT}"
          done
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: voice
          platforms: linux/amd64
          push: true
          # Uma etiqueta só, `X.Y.Z`: é o que a instalação grava e o que o atualizador pede.
          tags: ${{ steps.image.outputs.voice }}
          build-args: |
            APP_VERSION=${{ needs.probe.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.probe.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: routines
          platforms: linux/amd64
          push: true
          # Uma etiqueta só, `X.Y.Z`: é o que a instalação grava e o que o atualizador pede.
          tags: ${{ steps.image.outputs.routines }}
          build-args: |
            APP_VERSION=${{ needs.probe.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.probe.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: panel
          platforms: linux/amd64
          push: true
          # Uma etiqueta só, `X.Y.Z`: é o que a instalação grava e o que o atualizador pede.
          tags: ${{ steps.image.outputs.panel }}
          build-args: |
            APP_VERSION=${{ needs.probe.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.probe.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT

  # Publicar não basta: a VPS de quem instala baixa sem credencial. Um pacote novo no registro
  # nasce privado, e aí toda instalação para com "não consegui baixar as imagens". Este job não
  # entra no registro: pergunta pelas imagens como a VPS pergunta, e diz o conserto se não as vê.
  verify-public:
    name: verify-public
    needs: [probe, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: As três imagens baixam sem credencial?
        env:
          VERSION: ${{ needs.probe.outputs.version }}
        run: |
          source install/_common.sh
          missing=0
          for process in ${APP_SERVICES}; do
            ref="$(image_ref "${process}" "${VERSION}")"
            if docker buildx imagetools inspect "${ref}" >/dev/null 2>&1; then
              echo "ok: ${ref}" | tee -a "${GITHUB_STEP_SUMMARY}"
            else
              missing=1
              echo "::error::${ref} foi publicada, mas não baixa sem credencial. Abra o pacote deskvoice-${process} na organização (Packages), em Package settings mude a visibilidade para Public, e reexecute só este job."
            fi
          done
          exit "${missing}"
      # Aviso, e não erro: camada repetida custa disco, não quebra instalação, e não segura a
      # versão. Voz e rotinas só diferem no último passo (`COPY apps/<processo>`); se diferem
      # antes disso, o estágio `base` foi construído duas vezes.
      - name: Voz e rotinas dividem as camadas da base?
        # Se o formato do `imagetools inspect` mudar, este passo falha sozinho e não segura a versão.
        continue-on-error: true
        env:
          VERSION: ${{ needs.probe.outputs.version }}
        run: |
          source install/_common.sh
          layers() { docker buildx imagetools inspect --format '{{json .Image}}' "$(image_ref "$1" "${VERSION}")" | jq -c '.rootfs.diff_ids'; }
          voice="$(layers voice)"; routines="$(layers routines)"
          read -r total shared < <(jq -rn --argjson a "${voice}" --argjson b "${routines}" \
            '[([$a, $b] | map(length) | max), ([range(0; [$a, $b] | map(length) | min)] | map(select($a[.] == $b[.])) | length)] | @tsv')
          echo "Voz e rotinas: ${shared} de ${total} camadas iguais." | tee -a "${GITHUB_STEP_SUMMARY}"
          if [ "${shared}" -lt "$((total - 1))" ]; then
            echo "::warning::Voz e rotinas dividem só ${shared} de ${total} camadas: o estágio base foi construído mais de uma vez, e a VPS guarda as duas cópias."
          fi

  # Só agora a versão aparece como release: as imagens existem e baixam sem credencial.
  release:
    name: release
    needs: [probe, verify-public]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # publica a release do GitHub
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Publicar a release com as notas da versão
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.probe.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "A release v${VERSION} já existe: nada a publicar." | tee -a "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          pnpm exec tsx scripts/release.ts notes "${VERSION}" > "${RUNNER_TEMP}/notes.md"
          title="v${VERSION}"
          # "Exige ação do operador" é um campo à parte do número: aparece no título da release.
          if grep -q '^### Requer atenção' "${RUNNER_TEMP}/notes.md"; then title="v${VERSION} (requer atenção antes de atualizar)"; fi
          prerelease=""
          case "${VERSION}" in *-*) prerelease="--prerelease" ;; esac
          # shellcheck disable=SC2086
          gh release create "v${VERSION}" --verify-tag ${prerelease} --title "${title}" --notes-file "${RUNNER_TEMP}/notes.md"
