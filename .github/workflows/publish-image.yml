name: publish-image

# Em tag `vX.Y.Z`: constrói e publica uma imagem por processo, para amd64 e arm64, em
# ghcr.io/desklabs-opensource/deskvoice-{panel,voice,routines}:X.Y.Z.
#
# `stable` só é promovido em tag de versão final, e só depois que as TRÊS imagens publicaram:
# promover uma a uma deixaria, numa falha no meio, quem instala por `stable` com processos do
# mesmo sistema em versões diferentes (aconteceu no Deskcomm).
#
# `workflow_dispatch` existe para o release.yml disparar este workflow na tag que ele acabou de
# criar (tag empurrada pelo GITHUB_TOKEN não aciona `on: push`). Disparado fora de uma tag, recusa.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/desklabs-opensource

jobs:
  probe:
    name: probe
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      dockerfile: ${{ steps.probe.outputs.dockerfile }}
      version: ${{ steps.probe.outputs.version }}
      stable: ${{ steps.probe.outputs.stable }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Há o que publicar?
        id: probe
        run: |
          set -euo pipefail
          if [[ ! "${GITHUB_REF}" =~ ^refs/tags/v([0-9]+\.[0-9]+\.[0-9]+)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Imagem só se publica a partir de uma tag vX.Y.Z (veio de ${GITHUB_REF})."
            exit 1
          fi
          echo "version=${BASH_REMATCH[1]}${BASH_REMATCH[2]}" >> "${GITHUB_OUTPUT}"
          # Pré-versão (v1.2.0-rc.1) publica com o próprio número e não mexe em `stable`.
          if [ -z "${BASH_REMATCH[2]}" ]; then echo "stable=true" >> "${GITHUB_OUTPUT}"; else echo "stable=false" >> "${GITHUB_OUTPUT}"; fi
          if [ -f Dockerfile ]; then
            echo "dockerfile=true" >> "${GITHUB_OUTPUT}"
          else
            echo "dockerfile=false" >> "${GITHUB_OUTPUT}"
            echo "Publicação PULADA: esta tag ainda não tem Dockerfile na raiz." | tee -a "${GITHUB_STEP_SUMMARY}"
          fi

  build:
    name: build (${{ matrix.process }})
    needs: [probe]
    if: needs.probe.outputs.dockerfile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        process: [panel, voice, routines]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.process }}
          platforms: linux/amd64,linux/arm64
          push: true
          # Duas etiquetas para a mesma imagem: `X.Y.Z` e `vX.Y.Z`. O atualizador da VPS pede a
          # versão com o `v` da tag git; sem a segunda etiqueta o pull falhava sempre e toda
          # atualização construía a imagem na própria VPS.
          tags: |
            ${{ env.REGISTRY }}/deskvoice-${{ matrix.process }}:${{ needs.probe.outputs.version }}
            ${{ env.REGISTRY }}/deskvoice-${{ matrix.process }}:v${{ needs.probe.outputs.version }}
          build-args: |
            APP_VERSION=${{ needs.probe.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.probe.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT

  promote-stable:
    name: promote-stable
    needs: [probe, build]
    if: needs.probe.outputs.stable == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Apontar stable para a versão, nas três imagens
        env:
          VERSION: ${{ needs.probe.outputs.version }}
        run: |
          set -euo pipefail
          for process in panel voice routines; do
            docker buildx imagetools create --tag "${REGISTRY}/deskvoice-${process}:stable" "${REGISTRY}/deskvoice-${process}:${VERSION}"
          done
          echo "stable = ${VERSION} em deskvoice-panel, deskvoice-voice e deskvoice-routines." >> "${GITHUB_STEP_SUMMARY}"
