name: ci

# O que este workflow garante, e de que erro medido no Deskcomm cada parte nasceu:
#
# - UM run por PR: o push novo cancela o anterior (a fila do Deskcomm entupiu no teto de jobs).
# - O PR só é medido pelo próprio diff. Estado acumulado (cerca vencida, por exemplo) é check da
#   `main` e num PR só avisa.
# - Cada job diz, quando falha, se a causa provável é do PR ou da casa.
# - `ready` é o ÚNICO check exigido na proteção da main (scripts/github/apply-ruleset.sh). Job novo
#   entra em `needs` do `ready`, nunca na proteção de branch.
# - Nenhum job lê segredo: PR de fork roda exatamente o mesmo que PR interno.
#
# `workflow_dispatch` existe por um motivo só: o PR de release é aberto pelo GITHUB_TOKEN, e o
# GitHub não dispara `pull_request` para PR aberto por ele. O release.yml dispara este workflow
# no ramo `release/X.Y.Z`, e o check `ready` cai no mesmo commit.

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.paths.outputs.code }}
      images: ${{ steps.paths.outputs.images }}
      install: ${{ steps.paths.outputs.install }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Decidir o que roda pelo caminho alterado
        id: paths
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          QUEUE_BASE: ${{ github.event.merge_group.base_sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          case "${EVENT}" in
            pull_request) base="${PR_BASE}" ;;
            merge_group)  base="${QUEUE_BASE}" ;;
            push)         base="${PUSH_BEFORE}" ;;
            *)            base="" ;;
          esac
          # Sem base confiável (disparo manual, primeiro push), roda tudo: errar para mais é seguro.
          if [ -z "${base}" ] || ! files="$(git diff --name-only "${base}...HEAD" 2>/dev/null)"; then
            echo "sem base para comparar: roda tudo" | tee -a "${GITHUB_STEP_SUMMARY}"
            { echo "code=true"; echo "images=true"; echo "install=true"; } >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          docs='^(docs/|\.changes/|\.agents/|\.claude/skills/|\.cursor/|\.codex/|[^/]+\.md$|LICENSE$|\.github/ISSUE_TEMPLATE/|\.github/PULL_REQUEST_TEMPLATE\.md$|\.github/CODEOWNERS$)'
          # Here-string, não pipe: `grep -q` sai cedo e, com pipefail, um pipe quebrado viraria "não casou".
          matches() { if grep -Eq "$1" <<< "${files}"; then echo true; else echo false; fi; }
          if [ -n "${files}" ] && grep -Evq "${docs}" <<< "${files}"; then code=true; else code=false; fi
          images=false; install=false
          if [ "${code}" = true ]; then
            images="$(matches '^(Dockerfile|\.dockerignore|deploy/|packages/|apps/|package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|\.github/workflows/)')"
            # O job do instalador também sobe a instalação de verdade, com as imagens deste commit:
            # mudança de código que quebra a subida (ou a rota do agente) é dele.
            install="$(matches '^(install/|deploy/|Dockerfile|\.dockerignore|db/migrations/|packages/|apps/|package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|\.github/workflows/)')"
          fi
          { echo "code=${code}"; echo "images=${images}"; echo "install=${install}"; } >> "${GITHUB_OUTPUT}"
          {
            echo "| o que | roda |"; echo "|---|---|"
            echo "| lint, tipos, cercas, testes, segredos | sempre |"
            echo "| banco, chamada simulada, build do painel | ${code} |"
            echo "| imagens | ${images} |"
            echo "| instalador | ${install} |"
          } >> "${GITHUB_STEP_SUMMARY}"

  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        id: setup
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm fences
      - run: pnpm test
      - uses: ./.github/actions/explain-failure
        if: failure()
        with:
          setup-outcome: ${{ steps.setup.outcome }}
          when-pr: >-
            Rode `pnpm verify` na sua máquina: é a mesma sequência (lint, tipos, cercas, testes).
            Cerca vermelha traz na própria mensagem o que fazer para consertar.

  db:
    name: db
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.11-alpine@sha256:e5d2edd28b1f8d40a0a6c0c9cdc545b19b56a0d5d88f94bc11a97d970d4700d0
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: deskvoice_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d deskvoice_test"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      # Senha de um banco descartável que só existe dentro deste job; não é segredo.
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/deskvoice_test
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # o passo de atualização precisa das tags
          persist-credentials: false
      - uses: ./.github/actions/setup
        id: setup
      - name: Instalação nova (todas as migrations num banco vazio)
        run: pnpm test:db
      - name: Atualização a partir da última versão publicada
        run: |
          set -euo pipefail
          last="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)"
          if [ -z "${last}" ]; then
            echo "Teste de atualização PULADO: ainda não existe tag de versão, então não há instalação antiga para atualizar. Passa a rodar sozinho a partir da primeira release." | tee -a "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          previous="${RUNNER_TEMP}/previous"
          mkdir -p "${previous}"
          git archive "${last}" db/migrations | tar -x -C "${previous}"
          createdb -h 127.0.0.1 -U postgres deskvoice_upgrade
          pnpm exec tsx .github/scripts/upgrade-from-last-release.ts \
            "postgres://postgres:postgres@127.0.0.1:5432/deskvoice_upgrade" \
            "${previous}/db/migrations" db/migrations
          echo "Atualização a partir de ${last}: ok." >> "${GITHUB_STEP_SUMMARY}"
      - uses: ./.github/actions/explain-failure
        if: failure()
        with:
          setup-outcome: ${{ steps.setup.outcome }}
          when-pr: >-
            Reproduza com `pnpm db:test:up` (pede Docker) e `pnpm test:db`. Se quem falhou foi o
            passo de atualização: migration publicada nunca é editada (corrija com uma migration
            nova) e toda migration precisa funcionar sobre um banco que já tem dados.
          when-house: >-
            Você não precisa mudar nada: o Postgres do job ou a instalação de dependências não
            subiu. Um mantenedor reexecuta o job.

  simulated-call:
    name: simulated-call
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # A chamada simulada grava eventos, aprovação e tarefas: precisa de Postgres de verdade.
    services:
      postgres:
        image: postgres:17.11-alpine@sha256:e5d2edd28b1f8d40a0a6c0c9cdc545b19b56a0d5d88f94bc11a97d970d4700d0
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: deskvoice_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d deskvoice_test"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      # Senha de um banco descartável que só existe dentro deste job; não é segredo.
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/deskvoice_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        id: setup
      - name: Chamada simulada de ponta a ponta
        run: pnpm vitest run --project db apps/voice/src/simulated-call.db.test.ts
      - uses: ./.github/actions/explain-failure
        if: failure()
        with:
          setup-outcome: ${{ steps.setup.outcome }}
          when-pr: >-
            Rode `pnpm vitest run --project db apps/voice/src/simulated-call.db.test.ts` (pede
            Docker). Este teste atende uma ligação com o motor simulado, do toque ao fim: se ele
            quebrou, a mudança alterou o caminho de uma chamada (sequência de eventos, ferramenta,
            aprovação, transferência ou custo).

  build:
    name: build
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: O painel ainda não existe
        if: hashFiles('apps/panel/package.json') == ''
        run: echo "Build PULADO - apps/panel ainda não existe neste commit." >> "${GITHUB_STEP_SUMMARY}"
      - uses: ./.github/actions/setup
        id: setup
        if: hashFiles('apps/panel/package.json') != ''
      - name: Build do painel
        if: hashFiles('apps/panel/package.json') != ''
        run: pnpm --filter ./apps/panel build
      - uses: ./.github/actions/explain-failure
        if: failure()
        with:
          setup-outcome: ${{ steps.setup.outcome }}
          when-pr: >-
            Rode `pnpm --filter ./apps/panel build`. O build do Next.js pega o que o typecheck da
            raiz não vê: import de servidor em componente de cliente, página sem export padrão,
            variável lida em tempo de build.

  images:
    name: images
    needs: [changes]
    if: needs.changes.outputs.images == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Construir as três imagens, sem publicar
        id: docker
        run: |
          set -euo pipefail
          if [ ! -f Dockerfile ]; then
            echo "Imagens PULADAS: ainda não há Dockerfile neste commit." | tee -a "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          for target in panel voice routines; do
            docker build --target "${target}" --build-arg APP_VERSION=ci -t "deskvoice-${target}:ci" .
          done
      - uses: ./.github/actions/explain-failure
        if: failure()
        with:
          when-pr: >-
            Rode `docker build --target panel .` (e `voice`, `routines`). O que costuma quebrar:
            arquivo novo que o Dockerfile não copia, dependência fora do `pnpm-lock.yaml`, ou um
            alvo renomeado. Se a falha foi ao baixar a imagem base, a causa é da casa: peça a
            reexecução.

  install:
    name: install
    needs: [changes]
    if: needs.changes.outputs.install == 'true'
    runs-on: ubuntu-latest
    # Os testes do kit, a construção das três imagens, uma instalação de verdade no runner e os
    # testes de tela contra ela.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Testes do instalador
        run: |
          set -euo pipefail
          if [ ! -f install/test/run.sh ]; then
            echo "Instalador PULADO: install/test/run.sh ainda não existe neste commit." | tee -a "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          bash install/test/run.sh
      # Daqui em diante é Docker de verdade: o instalador constrói as imagens deste commit e sobe
      # tudo no runner, sem domínio. É a única prova, no CI, de coisas que o Docker de mentira não
      # vê: a conversa do agente de atualização com o painel e o que a entrada única deixa passar.
      - name: Instalar de verdade no runner (imagens construídas aqui)
        if: hashFiles('install/agent.sh') != ''
        env:
          DESKVOICE_DOMAIN: ""
          DESKVOICE_ORG_NAME: Empresa do CI
          DESKVOICE_OWNER_NAME: Pessoa do CI
          DESKVOICE_OWNER_EMAIL: ci@example.test
          # Endereço de documentação: o instalador não precisa consultar a internet para descobri-lo.
          DESKVOICE_PUBLIC_IP: 203.0.113.10
          DESKVOICE_HEALTH_TIMEOUT: "420"
        run: |
          set -euo pipefail
          # Senha do dono gerada nesta execução e escondida do log: nenhum job lê segredo guardado.
          DESKVOICE_OWNER_PASSWORD="ci-$(openssl rand -hex 16)"
          echo "::add-mask::${DESKVOICE_OWNER_PASSWORD}"
          export DESKVOICE_OWNER_PASSWORD
          # Os testes de tela, no fim do job, leem a senha deste arquivo: ela não vira variável de
          # ambiente para os outros passos nem para as ações de terceiros.
          install -m 600 /dev/null "${RUNNER_TEMP}/owner-password"
          printf '%s' "${DESKVOICE_OWNER_PASSWORD}" > "${RUNNER_TEMP}/owner-password"
          # O instalador só termina com zero depois de conferir a porta publicada e de entrar de
          # verdade pela tela de login com o dono que acabou de criar: se o login falhar, o passo
          # falha aqui. A saída fica guardada para o passo seguinte conferir que o login foi testado.
          bash install/install.sh --yes --build 2>&1 | tee "${RUNNER_TEMP}/install.log"
          if ! grep -q 'Login conferido' "${RUNNER_TEMP}/install.log"; then
            echo "::error::O instalador terminou sem dizer que conferiu o login do dono recém-criado."
            exit 1
          fi
          # Sem domínio, o padrão é o painel só nesta máquina: nenhuma porta web aberta para fora.
          published="$(sed -n 's/^ *- "\(.*\)"$/\1/p' deploy/docker-compose.override.yml | tr '\n' ' ')"
          echo "publicado: ${published}"
          case "${published}" in
            "127.0.0.1:"*":80 ") ;;
            *) echo "::error::Sem domínio, esperava uma única publicação em 127.0.0.1; o arquivo publica: ${published}"; exit 1 ;;
          esac
          # Só para o log: o instalador já parou acima se uma peça essencial não respondeu.
          NO_COLOR=1 bash install/healthcheck.sh || echo "a checagem de saúde acusou um item não essencial (acima)"
      # O serviço de WhatsApp fica num perfil e não sobe aqui (a imagem ocupa 3 GB). O que dá para
      # conferir sem baixá-la: o Compose é válido COM o perfil, usando os arquivos de ambiente que
      # esta instalação gerou, e a imagem que ele resolve está fixada por resumo.
      - name: O Compose é válido com o perfil do WhatsApp
        if: hashFiles('install/agent.sh') != ''
        run: |
          set -euo pipefail
          compose=(docker compose --env-file deploy/images.env --env-file deploy/.env --profile whatsapp -f deploy/docker-compose.yml -f deploy/docker-compose.override.yml)
          "${compose[@]}" config -q
          image="$("${compose[@]}" config --format json | jq -r '.services.waha.image')"
          echo "imagem do serviço de WhatsApp: ${image}"
          case "${image}" in
            devlikeapro/waha:*@sha256:????????????????????????????????????????????????????????????????) ;;
            *) echo "::error::A imagem do serviço de WhatsApp não está fixada por etiqueta e resumo: ${image}"; exit 1 ;;
          esac
          # Sem o perfil, o serviço não existe: é o padrão de toda instalação.
          if docker compose --env-file deploy/images.env --env-file deploy/.env -f deploy/docker-compose.yml -f deploy/docker-compose.override.yml config --services | grep -qx waha; then
            echo "::error::O serviço de WhatsApp aparece sem o perfil: ele subiria em toda instalação."; exit 1
          fi
      # O mesmo para a ligação pelo WhatsApp (WaCalls): válido com o perfil, imagem fixada por resumo,
      # nenhuma porta publicada e nada sem o perfil.
      - name: O Compose é válido com o perfil da ligação pelo WhatsApp
        if: hashFiles('install/agent.sh') != ''
        run: |
          set -euo pipefail
          compose=(docker compose --env-file deploy/images.env --env-file deploy/.env --profile whatsapp-calls -f deploy/docker-compose.yml -f deploy/docker-compose.override.yml)
          "${compose[@]}" config -q
          image="$("${compose[@]}" config --format json | jq -r '.services.wacalls.image')"
          echo "imagem do serviço de ligação pelo WhatsApp: ${image}"
          case "${image}" in
            # O que este passo exige é o resumo fixo; o dono do registro é o dos autores (jotadev66)
            # ou, até JotaDev66/WaCalls#69 ser publicado, o fork do projeto com o conserto do
            # caller_pn (o prefixo de deploy/images.env). Voltar a fixar só jotadev66 quando o #69
            # sair; revisar até 2027-02-13 mesmo sem isso (exceção gêmea em
            # fences/image-name-has-one-source).
            ghcr.io/*/wacalls@sha256:????????????????????????????????????????????????????????????????) ;;
            *) echo "::error::A imagem do serviço de ligação pelo WhatsApp não está fixada por resumo: ${image}"; exit 1 ;;
          esac
          if [ "$("${compose[@]}" config --format json | jq '.services.wacalls.ports // [] | length')" != 0 ]; then
            echo "::error::O serviço de ligação pelo WhatsApp publica porta: a API dele ficaria fora da rede interna."; exit 1
          fi
          if docker compose --env-file deploy/images.env --env-file deploy/.env -f deploy/docker-compose.yml -f deploy/docker-compose.override.yml config --services | grep -qx wacalls; then
            echo "::error::O serviço de ligação pelo WhatsApp aparece sem o perfil: ele subiria em toda instalação."; exit 1
          fi
      - name: O agente de atualização fala com o painel
        if: hashFiles('install/agent.sh') != ''
        run: |
          set -euo pipefail
          # Uma passada à mão. O timer que o instalador ligou pode estar no meio da dele (aí esta
          # sai sem fazer nada, por causa da trava): por isso algumas tentativas.
          for attempt in 1 2 3 4 5 6; do
            bash install/agent.sh || echo "passada ${attempt} saiu com erro"
            if [ -s deploy/agent/last-ok ]; then break; fi
            sleep 5
          done
          if [ ! -s deploy/agent/last-ok ]; then
            echo "::error::O agente não conseguiu falar com o painel (deploy/agent/last-ok não existe)."
            exit 1
          fi
          echo "O painel ouviu o agente em $(cat deploy/agent/last-ok)." | tee -a "${GITHUB_STEP_SUMMARY}"
          { NO_COLOR=1 bash install/healthcheck.sh || true; } | grep 'Agente de atualização' || true
      - name: A rota do agente não existe para quem vem de fora
        if: hashFiles('install/agent.sh') != ''
        run: |
          set -euo pipefail
          token="$(sed -n 's/^UPDATE_AGENT_TOKEN=//p' deploy/.env)"
          if [ -z "${token}" ]; then echo "::error::deploy/.env não tem o segredo do agente."; exit 1; fi
          echo "::add-mask::${token}"
          # A porta que o Caddy publicou nesta máquina: sem domínio, uma porta local em 127.0.0.1.
          entry="$(sed -n 's/^ *- "\(.*\):80"$/\1/p' deploy/docker-compose.override.yml | head -n 1)"
          port="${entry##*:}"
          # Sem resposta, o curl escreve 000: a comparação abaixo é que reprova, com a mensagem.
          status() { curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$@" || true; }
          health="$(status "http://127.0.0.1:${port}/api/v1/system/health")"
          outside="$(status -X POST -H 'content-type: application/json' -H "authorization: Bearer ${token}" -d '{"version":"local"}' "http://127.0.0.1:${port}/api/v1/system/agent")"
          echo "pela entrada única (porta ${port}): saúde=${health} rota do agente=${outside}"
          # A saúde em 200 prova que o 404 é da rota, e não de uma entrada que não responde.
          if [ "${health}" != 200 ] || [ "${outside}" != 404 ]; then
            echo "::error::Pela entrada única, esperava saúde=200 e rota do agente=404, mesmo com o segredo certo."
            exit 1
          fi
          # De dentro do contêiner do painel, com o segredo certo: direto responde; com o cabeçalho
          # que todo proxy acrescenta, não existe. O segredo vai pela entrada padrão.
          # shellcheck source=/dev/null
          source install/_common.sh
          inside="$(printf '%s' "${token}" | dc exec -T panel node -e '
            let t = ""; process.stdin.on("data", (d) => (t += d)).on("end", async () => {
              const call = async (extra) => (await fetch("http://127.0.0.1:3000/api/v1/system/agent", { method: "POST", headers: { "content-type": "application/json", authorization: "Bearer " + t, ...extra }, body: JSON.stringify({ version: "local" }) })).status;
              console.log("direto=" + (await call({})) + " por-proxy=" + (await call({ "x-forwarded-for": "203.0.113.9" })));
            });')"
          echo "de dentro do contêiner do painel: ${inside}"
          if [ "${inside}" != "direto=200 por-proxy=404" ]; then
            echo "::error::De dentro do painel, esperava direto=200 e por-proxy=404."
            exit 1
          fi
      # A atualização regrava a configuração do Asterisk e a recarrega sem reiniciá-lo (reiniciar
      # derruba as ligações). O Docker de mentira dos testes do kit não prova que o Asterisk 20 de
      # verdade aceita recarregar os cinco módulos, nem que a ARI do processo de voz sobrevive. Aqui,
      # pelo caminho de uma versão nova: os cinco modelos mudam (uma linha de comentário),
      # render_asterisk_config regrava no lugar e anota o pendente, e converge_asterisk recarrega.
      - name: A configuração do Asterisk recarrega sem reiniciá-lo
        if: hashFiles('install/agent.sh') != ''
        run: |
          set -euo pipefail
          # shellcheck source=/dev/null
          source install/_common.sh
          state() { docker inspect -f '{{.Id}} {{.RestartCount}} {{.State.StartedAt}}' "$(dc ps -q asterisk)"; }
          before="$(state)"; since="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for f in extensions.conf http.conf ari.conf.tmpl rtp.conf.tmpl pjsip.conf.base; do
            printf '; ci %s: comentário de uma versão nova\n' "${GITHUB_RUN_ID}" >> "deploy/asterisk/${f}"
          done
          render_asterisk_config
          git checkout -- deploy/asterisk
          echo "anotado para recarregar: $(sort -u "${ASTERISK_PENDING}" | tr '\n' ' ')"
          out="$(converge_asterisk 2>&1)"
          printf '%s\n' "${out}" | tee "${RUNNER_TEMP}/asterisk-reload.log"
          # Uma desconexão da ARI aparece no log da voz em instantes; a reconexão leva até segundos.
          sleep 15
          after="$(state)"
          telephony="$(NO_COLOR=1 bash install/healthcheck.sh --json 2>/dev/null | jq -r '.checks[] | select(.id == "telephony") | .status + " " + .detail' || true)"
          # Lido antes de contar: um `docker compose logs` que falha não pode virar "zero desconexões".
          voice_log="$(dc logs --no-color --since "${since}" voice)"
          dropped="$(printf '%s\n' "${voice_log}" | grep -c 'ari events disconnected' || true)"
          echo "antes:  ${before}"; echo "depois: ${after}"; echo "controle da telefonia: ${telephony}"; echo "desconexões da ARI no log da voz: ${dropped}"
          problems=""
          # A frase só sai quando os cinco módulos responderam "reloaded successfully" ao Asterisk de verdade.
          case "${out}" in
            *"Asterisk com a configuração desta versão (ari.conf extensions.conf http.conf pjsip.conf rtp.conf), recarregada sem derrubar ligações"*) ;;
            *) problems="${problems} a saída do converge_asterisk não diz que os cinco arquivos foram recarregados;" ;;
          esac
          [ "${before}" = "${after}" ] || problems="${problems} o contêiner do Asterisk foi reiniciado ou recriado;"
          case "${telephony}" in ok\ *) ;; *) problems="${problems} a linha 'Controle da telefonia' da saúde não está ok;" ;; esac
          [ "${dropped}" = 0 ] || problems="${problems} a ARI do processo de voz caiu durante a recarga;"
          if [ -n "${problems}" ]; then
            echo "::error::Recarregar a configuração do Asterisk:${problems}"
            echo "--- Asterisk"; dc logs --no-color --tail 60 asterisk 2>&1 | mask_secrets
            echo "--- voz, desde a recarga"; printf '%s\n' "${voice_log}" | mask_secrets
            exit 1
          fi
          echo "A configuração do Asterisk recarregou os cinco módulos sem reiniciá-lo, e a ARI da voz seguiu conectada." | tee -a "${GITHUB_STEP_SUMMARY}"
      # Testes de tela (apps/panel/test/e2e): o Chromium entra pela porta que o Caddy publicou, no
      # sistema que este job acabou de subir, com o dono que o instalador criou. Entrar, configurar,
      # simular uma chamada, convidar e as confirmações antes de apagar. Não sobe nada de novo.
      - uses: ./.github/actions/setup
        if: hashFiles('install/agent.sh') != ''
      - name: Versão do Playwright
        id: playwright
        if: hashFiles('install/agent.sh') != ''
        run: echo "version=$(node -p "require('./apps/panel/package.json').devDependencies['@playwright/test']")" >> "${GITHUB_OUTPUT}"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: hashFiles('install/agent.sh') != ''
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}
      - name: Testes de tela pela entrada única
        if: hashFiles('install/agent.sh') != ''
        env:
          # O mesmo e-mail do dono criado no passo de instalação.
          DESKVOICE_E2E_EMAIL: ci@example.test
        run: |
          set -euo pipefail
          # Com o navegador no cache, só as bibliotecas do sistema são instaladas.
          pnpm --filter ./apps/panel exec playwright install --with-deps --only-shell chromium
          entry="$(sed -n 's/^ *- "\(.*\):80"$/\1/p' deploy/docker-compose.override.yml | head -n 1)"
          export DESKVOICE_E2E_URL="http://127.0.0.1:${entry##*:}"
          DESKVOICE_E2E_PASSWORD="$(cat "${RUNNER_TEMP}/owner-password")"
          export DESKVOICE_E2E_PASSWORD
          echo "painel em ${DESKVOICE_E2E_URL}"
          pnpm test:e2e
      # O rastro mostra cada passo, a tela e as respostas da API. Ele carrega a senha do dono desta
      # instalação, que só existiu neste runner e morre com ele.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure() && hashFiles('apps/panel/test/e2e/test-results/**') != ''
        with:
          name: testes-de-tela
          path: |
            apps/panel/test/e2e/test-results/
            apps/panel/test/e2e/playwright-report/
          retention-days: 7
      - name: O que estava no ar quando falhou
        if: failure() && hashFiles('deploy/.env') != ''
        run: |
          # shellcheck source=/dev/null
          source install/_common.sh; set +e; trap - ERR
          NO_COLOR=1 bash install/healthcheck.sh
          echo "--- deploy/agent/agent.log"; tail -n 30 deploy/agent/agent.log 2>/dev/null | mask_secrets
          echo "--- painel e Caddy"; dc logs --no-color --tail 40 panel caddy 2>&1 | mask_secrets
          echo "--- recarga da configuração do Asterisk"; cat "${RUNNER_TEMP}/asterisk-reload.log" 2>/dev/null
          echo "--- Asterisk e voz"; dc logs --no-color --tail 40 asterisk voice 2>&1 | mask_secrets
      - uses: ./.github/actions/explain-failure
        if: failure()
        with:
          when-pr: >-
            Rode `bash install/test/run.sh`. Estes testes cobrem os validadores do instalador, a
            atualização e o ciclo backup → restauração com conferência de contagens. Se o que
            falhou foi um passo depois deles, é a instalação de verdade no runner: o passo "O que
            estava no ar quando falhou" mostra a saúde de cada peça e os logs. Quem instala é o
            usuário, numa VPS: o que quebra aqui quebra na casa de alguém. Se quem falhou foi
            "Testes de tela", baixe o artefato `testes-de-tela` (relatório e rastro de cada passo,
            com a tela) e rode na sua máquina `pnpm test:e2e` contra um painel no ar; o passo a
            passo está na skill `deskvoice-contribuir`.

  secrets:
    name: secrets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Instalar o gitleaks (versão e hash fixos)
        id: tool
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          # O binário, e não a action oficial: ela exige licença paga para organizações.
          curl -fsSL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          mkdir -p "${RUNNER_TEMP}/bin"
          tar -xzf gitleaks.tar.gz -C "${RUNNER_TEMP}/bin" gitleaks
          rm gitleaks.tar.gz
      - name: Varrer segredo nos commits desta mudança
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          QUEUE_BASE: ${{ github.event.merge_group.base_sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          case "${EVENT}" in
            pull_request) base="${PR_BASE}" ;;
            merge_group)  base="${QUEUE_BASE}" ;;
            push)         base="${PUSH_BEFORE}" ;;
            *)            base="$(git merge-base origin/main HEAD 2>/dev/null || true)" ;;
          esac
          if [ -n "${base}" ] && git cat-file -e "${base}^{commit}" 2>/dev/null; then range="${base}..HEAD"; else range="-1 HEAD"; fi
          echo "varrendo: ${range}"
          "${RUNNER_TEMP}/bin/gitleaks" git --no-banner --redact --log-opts="${range}" .
      - uses: ./.github/actions/explain-failure
        if: failure()
        with:
          setup-outcome: ${{ steps.tool.outcome }}
          when-pr: >-
            Um commit desta mudança carrega algo com cara de segredo (o log acima diz o arquivo e
            a linha, sem repetir o valor). Se é real: REVOGUE a chave agora, antes de qualquer
            outra coisa, porque ela já está pública; depois troque por um valor inventado e
            reescreva o commit. Se é exemplo: use um valor que não pareça chave de verdade.

  ready:
    name: ready
    if: always()
    needs: [changes, verify, db, simulated-call, build, images, install, secrets]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Todos os necessários passaram ou foram pulados por caminho?
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "${NEEDS}" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          # `skipped` só vale para o que o job `changes` decide pular. Os três que rodam sempre
          # precisam de `success`: um `changes` que falha pula todo o resto e não pode sair verde.
          failed="$(echo "${NEEDS}" | jq -r '
            [ to_entries[]
              | select(.value.result != "success"
                       and (.value.result != "skipped" or (.key | IN("changes", "verify", "secrets"))))
              | "\(.key) (\(.value.result))" ] | join(", ")')"
          if [ -n "${failed}" ]; then
            echo "Não está pronto: ${failed}. Abra o job vermelho: o resumo dele diz de quem é a causa provável e o que fazer." | tee -a "${GITHUB_STEP_SUMMARY}"
            exit 1
          fi
          echo "Pronto: tudo o que este diff precisava rodar passou." >> "${GITHUB_STEP_SUMMARY}"
