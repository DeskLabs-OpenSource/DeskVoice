version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    # Versão maior é decisão, com PR próprio que diz o que muda (CONTRIBUTING, "Versão maior de
    # dependência"): pode subir o piso do Node (engines >=22) sem ninguém perceber.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # As actions são fixadas por SHA com a versão em comentário; o Dependabot atualiza os dois.
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(ci)

  # A base das imagens (FROM no Dockerfile) é fixada por versão e resumo; sem quem a atualize, ela
  # congela as correções de segurança do Node e do Alpine. O Dependabot troca etiqueta e resumo
  # juntos. As imagens do CI sobem à mão, com o resumo conferido no registro.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    # O projeto está no Node 22 (.nvmrc e engines). Trocar de versão maior do Node é decisão, com
    # PR próprio que mexe nos dois juntos, e não uma atualização de base.
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]

  # As imagens de terceiros do deploy/docker-compose.yml, fixadas por versão e resumo. Postgres e
  # Caddy estão escritos por extenso; Asterisk e WAHA vêm dentro de ${VAR:-imagem@sha256:…}, e não
  # se sabe se o Dependabot enxerga imagem dentro de interpolação. Conferir na primeira execução
  # (Insights → Dependency graph → Dependabot); a que ele não enxergar continua subindo à mão.
  # O Asterisk está fixado só por resumo, sem etiqueta: sem etiqueta não há "versão mais nova", e
  # ele sobe à mão mesmo que o Dependabot o enxergue.
  - package-ecosystem: docker-compose
    directory: /deploy
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    # Versão maior do Postgres muda o formato dos arquivos do banco: a instalação existente não sobe
    # com a imagem nova sem uma conversão (pg_upgrade, ou dump e restauração) feita pelo kit. Do
    # Caddy e do WAHA, também é decisão. Ver CONTRIBUTING, "Versão maior de dependência".
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
