version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  # As actions são fixadas por SHA com a versão em comentário; o Dependabot atualiza os dois.
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(ci)

  # A base das imagens (FROM no Dockerfile) é fixada por versão e resumo; sem quem a atualize, ela
  # congela as correções de segurança do Node e do Alpine. O Dependabot troca etiqueta e resumo
  # juntos. As imagens do deploy/docker-compose.yml (Postgres, Caddy, Asterisk, WAHA) e do CI não
  # entram aqui: sobem à mão, com o resumo conferido no registro.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
